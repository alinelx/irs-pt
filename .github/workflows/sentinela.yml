name: Sentinela legal

on:
  schedule:
    - cron: "0 7 1 * *"    # dia 1 de cada mês, 07:00 UTC
    - cron: "0 7 15 1 *"   # 15 de janeiro (OE + portaria do IAS já publicados)
    - cron: "0 7 10 7 *"   # 10 de julho (alterações de meio de ano, ex. DL 35/2025)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) Comparar. Só escreve snapshots no disco do runner; nada é publicado ainda.
      - name: Comparar com os snapshots
        run: python sentinela/vigiar.py

      # 2) Publicar o ALERTA PRIMEIRO. Se isto falhar, o job para e a baseline NÃO é atualizada,
      #    logo o run seguinte volta a detetar a mesma mudança. Nunca se absorve uma alteração em silêncio.
      - name: Garantir etiqueta
        if: ${{ hashFiles('sentinela/ALERTA.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create sentinela --color D93F0B --description "Fonte legal alterada ou inacessível" --force

      - name: Abrir issue com o alerta
        if: ${{ hashFiles('sentinela/ALERTA.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Sentinela: fontes legais alteradas ($(date -u +%F))" \
            --label sentinela \
            --body-file sentinela/ALERTA.md

      # 3) Só agora a nova baseline é guardada — depois de o alerta estar publicado.
      - name: Guardar snapshots atualizados
        run: |
          git config user.name "sentinela-bot"
          git config user.email "sentinela@users.noreply.github.com"
          git add sentinela/snapshots
          git diff --cached --quiet || git commit -m "sentinela: snapshots $(date -u +%F)"
          git push
