name: Sentinela legal

on:
  schedule:
    - cron: "0 7 1 * *"    # dia 1 de cada mês, 07:00 UTC
    - cron: "0 7 15 1 *"   # 15 de janeiro (OE + portaria do IAS já publicados)
    - cron: "0 7 10 7 *"   # 10 de julho (alterações de meio de ano, ex. DL 35/2025)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comparar com os snapshots
        run: python sentinela/vigiar.py

      # A issue vem ANTES do commit da baseline. Se a ordem fosse a inversa e este passo
      # falhasse, a baseline nova já estaria publicada e a mudança detetada desaparecia:
      # a execução seguinte compararia novo com novo e nunca mais haveria alerta.
      - name: Abrir issue se houver alerta
        if: ${{ hashFiles('sentinela/ALERTA.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create sentinela \
            --color B35C00 \
            --description "Alerta automático da sentinela legal" \
            --force
          gh issue create \
            --title "Sentinela: fontes legais alteradas ($(date -u +%F))" \
            --label "sentinela" \
            --body-file sentinela/ALERTA.md

      # Só depois de o alerta estar publicado é que a baseline avança.
      - name: Guardar snapshots atualizados
        if: success()
        run: |
          git config user.name "sentinela-bot"
          git config user.email "sentinela@users.noreply.github.com"
          git add sentinela/snapshots
          git diff --cached --quiet || git commit -m "sentinela: snapshots $(date -u +%F)"
          git push
